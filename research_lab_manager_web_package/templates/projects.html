{% extends 'base.html' %}
{% import 'table_macro.html' as tbl %}
{% block content %}
<div class="title-row"><h2>Projects</h2><a class="button" href="{{ url_for('add_project') }}">Add Project</a></div>
<form method="GET" action="/projects">
  <input type="text" name="search" placeholder="Search by title or PID" value="{{ search or '' }}">
  <button type="submit">Search</button>
</form>
{{ tbl.render_table(rows) }}
<div class="actions-list">
{% for r in rows %}
  <form method="post" action="{{ url_for('delete_project', pid=r.PID) }}"><a href="{{ url_for('edit_project', pid=r.PID) }}">Edit {{ r.PID }}</a><button class="danger">Delete {{ r.PID }}</button></form>
{% endfor %}
</div>
{% endblock %}
