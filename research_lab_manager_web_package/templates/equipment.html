{% extends 'base.html' %}
{% import 'table_macro.html' as tbl %}
{% block content %}
<div class="title-row"><h2>Equipment</h2><a class="button" href="{{ url_for('add_equipment') }}">Add Equipment</a></div>
<form method="GET" action="/equipment" style="margin: 10px 0;">
  <input type="text" name="search" placeholder="Search by name, type, or EID" value="{{ search or '' }}">
  <button type="submit">Search</button>
</form>
{{ tbl.render_table(rows) }}
<div class="actions-list">
{% for r in rows %}
  <form method="post" action="{{ url_for('delete_equipment', eid=r.EID) }}"><a href="{{ url_for('edit_equipment', eid=r.EID) }}">Edit {{ r.EID }}</a><button class="danger">Delete {{ r.EID }}</button></form>
{% endfor %}
</div>
{% endblock %}
