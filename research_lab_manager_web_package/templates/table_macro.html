{% macro render_table(rows) %}
  {% if rows %}
  <div class="table-wrap"><table>
    <thead><tr>{% for key in rows[0].keys() %}<th>{{ key }}</th>{% endfor %}</tr></thead>
    <tbody>{% for row in rows %}<tr>{% for val in row.values() %}<td>{{ val }}</td>{% endfor %}</tr>{% endfor %}</tbody>
  </table></div>
  {% else %}<p class="muted">No rows to display.</p>{% endif %}
{% endmacro %}
